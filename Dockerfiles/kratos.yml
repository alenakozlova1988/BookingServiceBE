version: "1" # Убедитесь, что это актуальная версия схемы для вашей версии Kratos.

# --- Подключение к базе данных ---
dsn: "postgres://kratos:kratospassword@kratos-db:5432/kratos?sslmode=disable&max_conns=20&min_conns=0"
# Обратите внимание: 'kratos-db' должно точно совпадать с именем сервиса в docker-compose.yml

# --- Настройки серверов ---
serve:
  public:
    base_url: "http://localhost:4433/" # Публичный API
    port: 4433
  admin:
    base_url: "http://localhost:4434/" # Админский API
    port: 4434

# --- Настройки логирования ---
log:
  level: info
  format: text

# --- Секреты (критически важно!) ---
secrets:
  cookie: "YOUR_VERY_STRONG_SECRET_FOR_COOKIES_REPLACE_ME" # ЗАМЕНИТЕ ЭТО НА НАДЕЖНЫЙ СЕКРЕТ
  cipher: "YOUR_VERY_STRONG_SECRET_FOR_CIPHER_REPLACE_ME"  # ЗАМЕНИТЕ ЭТО НА НАДЕЖНЫЙ СЕКРЕТ

# --- Настройки самообслуживания (Self-Service) ---
selfservice:
  # Это поле было ОБЯЗАТЕЛЬНЫМ и отсутствовало в предыдущем примере.
  default_browser_return_url: "http://localhost:4433/welcome" # URL, куда пользователь будет перенаправлен после успешного завершения потока (например, логина или регистрации)
  # Другие настройки Sself-service могут быть здесь, но min required - default_browser_return_url

  # Настройки потоков (flows) - обычно здесь указываются URL-ы для конкретных потоков
  flows:
    settings:
      ui:
        urls:
          whitelisted_redirect_urls:
            - "http://localhost:4433/welcome" # Пример URL для перенаправления после настроек профиля
    recovery:
      ui:
        urls:
          whitelisted_redirect_urls:
            - "http://localhost:4433/recovery/sent"
            - "http://localhost:4433/recover/sent"
    verification:
      ui:
        urls:
          whitelisted_redirect_urls:
            - "http://localhost:4433/verification/sent"
            - "http://localhost:4433/verify/sent"
    login:
      ui:
        urls:
          whitelisted_redirect_urls:
            - "http://localhost:4433/welcome"
    logout:
      ui:
        urls:
          whitelisted_redirect_urls:
            - "http://localhost:4433/welcome"
    registration:
      ui:
        urls:
          whitelisted_redirect_urls:
            - "http://localhost:4433/welcome"

# --- Схемы пользователей (Identity Schemas) ---
identity:
  schemas:
    # Это поле было ОБЯЗАТЕЛЬНЫМ и отсутсвовало в предыдущем примере.
    # Вам нужно указать здесь хотя бы одну схему.
    - id: "default" # Идентификатор схемы
      url: "/etc/kratos/schema.json" # Путь к вашему файлу схемы JSON
      # Вы также можете указать 'preset' вместо 'url', например, 'preset: "email-password"'